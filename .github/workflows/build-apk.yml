name: Build PushBot APK for OpenWrt 25.12

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Architecture (例如: x86, ramips, mediatek)'
        required: true
        default: 'x86'
      subtarget:
        description: 'Subtarget Architecture (例如: 64, mt7621, filogic)'
        required: true
        default: '64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取当前仓库源码
        uses: actions/checkout@v4

      - name: 2. 安装编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget zstd python3

      - name: 3. 下载并解压 OpenWrt SDK
        run: |
          TARGET="${{ github.event.inputs.target }}"
          SUBTARGET="${{ github.event.inputs.subtarget }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          
          echo "正在查找架构 ${TARGET}/${SUBTARGET} 的 SDK..."
          SDK_FILE=$(curl -s $BASE_URL/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.(zst|xz)' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 未找到对应的 SDK 文件，请检查 Target/Subtarget 参数是否正确！"
            exit 1
          fi
          
          echo "下载 SDK: $SDK_FILE"
          wget -q "$BASE_URL/$SDK_FILE"
          
          echo "解压 SDK..."
          if [[ "$SDK_FILE" == *.zst ]]; then
            tar -I zstd -xf $SDK_FILE
          else
            tar -xf $SDK_FILE
          fi
          
          # 安全精准地重命名 SDK 文件夹
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -n "$SDK_DIR" ]; then
            mv "$SDK_DIR" sdk
          else
            echo "错误：未找到解压后的 SDK 文件夹！"
            exit 1
          fi

      - name: 4. 配置插件并编译
        run: |
          cd sdk
          
          # 1. 将 PushBot 源码放入 SDK 的 package 目录
          mkdir -p package/luci-app-pushbot
          cp -r ../* package/luci-app-pushbot/ 2>/dev/null || true
          
          # 2. 更新并安装所有官方 Feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p luci
          
          # 3. 开启选择并编译
          make defconfig
          make package/luci-app-pushbot/compile V=s -j1

      - name: 5. 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-pushbot-apk-${{ github.event.inputs.target }}-${{ github.event.inputs.subtarget }}
          path: sdk/bin/packages/*/base/luci-app-pushbot*.apk
