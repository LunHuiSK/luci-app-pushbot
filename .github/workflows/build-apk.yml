name: Build PushBot APK for OpenWrt 25.12

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Architecture (例如: x86, ramips, mediatek)'
        required: true
        default: 'x86'
      subtarget:
        description: 'Subtarget Architecture (例如: 64, mt7621, filogic)'
        required: true
        default: '64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取当前仓库源码
        uses: actions/checkout@v4

      - name: 2. 安装依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget zstd

      - name: 3. 动态获取并解压 OpenWrt 25.12/Snapshot SDK
        run: |
          TARGET="${{ github.event.inputs.target }}"
          SUBTARGET="${{ github.event.inputs.subtarget }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          
          echo "正在查找架构 ${TARGET}/${SUBTARGET} 的 SDK..."
          SDK_FILE=$(curl -s $BASE_URL/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.(zst|xz)' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 未找到对应的 SDK 文件，请检查 Target/Subtarget 是否正确！"
            exit 1
          fi
          
          echo "正在下载: $SDK_FILE"
          wget -q "$BASE_URL/$SDK_FILE"
          
          echo "解压 SDK..."
          if [[ "$SDK_FILE" == *.zst ]]; then
            tar -I zstd -xf $SDK_FILE
          else
            tar -xf $SDK_FILE
          fi
          
          mv openwrt-sdk-* sdk

      - name: 4. 配置插件源码并编译
        run: |
          cd sdk
          # 将项目源码放入 package 目录
          mkdir -p package/luci-app-pushbot
          cp -r ../* package/luci-app-pushbot/ 2>/dev/null || true
          
          # 更新并安装 feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 选择该插件并开始编译
          make defconfig
          make package/luci-app-pushbot/compile V=s

      - name: 5. 提取并上传打包编译好的 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-pushbot-apk-${{ github.event.inputs.target }}-${{ github.event.inputs.subtarget }}
          path: sdk/bin/packages/*/base/luci-app-pushbot*.apk
